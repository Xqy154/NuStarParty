name: Gradle Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x publish -x publishToMavenLocal

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NuStarParty-artifacts
          path: |
            party-core/build/libs/*.jar
            party-api/build/libs/*.jar
            party-hooks/build/libs/*.jar
          retention-days: 7